<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Book Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        .profile-header {
            background: #1f1f1f;
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid #2d2d2d;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #667eea;
        }

        .card {
            background: #1f1f1f;
            border: 1px solid #2d2d2d;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .card-title {
            color: #ffffff;
        }

        .card-text {
            color: #b0b0b0;
        }

        .btn-primary {
            background: #667eea;
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .form-control, .form-select {
            background: #2a2a2a;
            border: 2px solid #3d3d3d;
            color: #ffffff;
            border-radius: 10px;
        }

        .form-control:focus, .form-select:focus {
            background: #333333;
            border-color: #667eea;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
        }

        .form-control::placeholder {
            color: #808080;
        }

        .form-label {
            color: #b0b0b0;
            font-weight: 600;
        }

        .badge {
            background: #667eea;
            padding: 0.5rem 1rem;
        }

        .tab-content {
            margin-top: 2rem;
        }

        .nav-tabs {
            border-bottom: 2px solid #2d2d2d;
        }

        .nav-tabs .nav-link {
            color: #b0b0b0;
            border: none;
            padding: 1rem 1.5rem;
        }

        .nav-tabs .nav-link.active {
            color: #ffffff;
            background: transparent;
            border-bottom: 3px solid #667eea;
        }

        .book-item, .review-item {
            background: #2a2a2a;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #3d3d3d;
            color: #ffffff;
        }

        .book-item h4, .review-item h4 {
            color: #ffffff;
        }

        .book-item p, .review-item p {
            color: #b0b0b0;
        }

        .text-muted {
            color: #b0b0b0 !important;
        }

        small {
            color: #808080;
        }

        .btn-sm {
            border: 2px solid #3d3d3d;
            background: #2a2a2a;
            color: #ffffff;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-sm:hover {
            background: #333333;
            border-color: #667eea;
            color: #ffffff;
        }

        .btn-danger {
            background: #dc3545;
            border: none;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        h2, h3, h4 {
            color: #ffffff;
        }

        .modal-content {
            background: #1f1f1f;
            border: 1px solid #2d2d2d;
        }

        .modal-header {
            border-bottom: 1px solid #2d2d2d;
        }

        .modal-footer {
            border-top: 1px solid #2d2d2d;
        }

        .btn-close {
            filter: invert(1);
        }

        .btn-secondary {
            background: #3d3d3d;
            border: none;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background: #4d4d4d;
            color: #ffffff;
        }

        p {
            color: #b0b0b0;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <div class="container my-5">
        <!-- Profile Header -->
        <div class="profile-header text-center">
            <img id="profilePic" src="https://via.placeholder.com/100" alt="Profile" class="profile-pic mb-3">
            <h2 id="userName">Loading...</h2>
            <p id="userEmail" class="text-muted"></p>
            <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#createBookModal">
                <i class="bi bi-plus-circle"></i> Add New Book
            </button>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs" id="profileTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="books-tab" data-bs-toggle="tab" data-bs-target="#books" type="button">
                    <i class="bi bi-book"></i> My Books
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="reviews-tab" data-bs-toggle="tab" data-bs-target="#reviews" type="button">
                    <i class="bi bi-star"></i> My Reviews
                </button>
            </li>
        </ul>

        <div class="tab-content" id="profileTabContent">
            <!-- My Books Tab -->
            <div class="tab-pane fade show active" id="books" role="tabpanel">
                <div id="booksList">
                    <p class="text-center text-muted">Loading your books...</p>
                </div>
            </div>

            <!-- My Reviews Tab -->
            <div class="tab-pane fade" id="reviews" role="tabpanel">
                <div id="reviewsList">
                    <p class="text-center text-muted">Loading your reviews...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Book Modal -->
    <div class="modal fade" id="createBookModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Book</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createBookForm">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="bookTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Author</label>
                            <input type="text" class="form-control" id="bookAuthor" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="bookDescription" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Published Date</label>
                            <input type="date" class="form-control" id="bookDate" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createBook()">Create Book</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Update Book Modal -->
    <div class="modal fade" id="updateBookModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Book</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="updateBookForm">
                        <input type="hidden" id="updateBookId">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="updateBookTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Author</label>
                            <input type="text" class="form-control" id="updateBookAuthor" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="updateBookDescription" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Published Date</label>
                            <input type="date" class="form-control" id="updateBookDate" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateBook()">Update Book</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Load navbar
        async function loadNavbar() {
            try {
                const response = await fetch('navbar.html');
                if (!response.ok) throw new Error('Failed to load navbar');
                document.getElementById('navbar').innerHTML = await response.text();
            } catch (error) {
                console.error('Error loading navbar:', error);
            }
        }

        // Load user profile
        async function loadProfile() {
            try {
                const response = await fetch('/auth/me');
                if (!response.ok) {
                    window.location.href = '/login';
                    return;
                }
                const data = await response.json();
                const user = data.user;
                
                document.getElementById('userName').textContent = user.name || user.displayName;
                document.getElementById('userEmail').textContent = user.email;
                if (user.profilePicture || user.photos) {
                    document.getElementById('profilePic').src = user.profilePicture || user.photos[0]?.value;
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                window.location.href = '/login';
            }
        }

        // Show alert modal
        function showAlert(title, message) {
            document.getElementById('alertModalTitle').textContent = title;
            document.getElementById('alertModalMessage').textContent = message;
            const modal = new bootstrap.Modal(document.getElementById('alertModal'));
            modal.show();
        }

        // Load user's books
        async function loadMyBooks() {
            try {
                const response = await fetch('/books');
                if (!response.ok) throw new Error('Failed to load books');
                const allBooks = await response.json();
                
                const userResponse = await fetch('/auth/me');
                const userData = await userResponse.json();
                const userId = userData.user._id || userData.user.id;
                
                const myBooks = allBooks.filter(book => book.createdBy === userId);
                
                const booksList = document.getElementById('booksList');
                if (myBooks.length === 0) {
                    booksList.innerHTML = '<p class="text-center text-muted">You haven\'t added any books yet.</p>';
                    return;
                }
                
                booksList.innerHTML = myBooks.map(book => `
                    <div class="book-item">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h4>${book.title}</h4>
                                <p class="text-muted mb-2">by ${book.author}</p>
                                <p class="card-text">${book.description}</p>
                                <small class="text-muted">Published: ${new Date(book.publishedDate).toLocaleDateString()}</small>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-warning me-2" onclick="editBook('${book._id}', '${book.title.replace(/'/g, "\\'").replace(/"/g, '&quot;')}', '${book.author.replace(/'/g, "\\'").replace(/"/g, '&quot;')}', '${book.description.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ')}', '${book.publishedDate}')">
                                    <i class="bi bi-pencil"></i> Edit
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteBook('${book._id}')">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading books:', error);
                document.getElementById('booksList').innerHTML = '<p class="text-center text-danger">Failed to load books.</p>';
            }
        }

        // Load user's reviews
        async function loadMyReviews() {
            try {
                const response = await fetch('/reviews');
                if (!response.ok) throw new Error('Failed to load reviews');
                const allReviews = await response.json();
                
                const userResponse = await fetch('/auth/me');
                const userData = await userResponse.json();
                const userId = userData.user._id || userData.user.id;
                
                const myReviews = allReviews.filter(review => review.createdBy === userId);
                
                const reviewsList = document.getElementById('reviewsList');
                if (myReviews.length === 0) {
                    reviewsList.innerHTML = '<p class="text-center text-muted">You haven\'t written any reviews yet.</p>';
                    return;
                }
                
                reviewsList.innerHTML = myReviews.map(review => `
                    <div class="review-item">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="mb-2">
                                    ${'⭐'.repeat(review.rating)}
                                </div>
                                <p class="card-text">${review.comment}</p>
                                <small class="text-muted">${new Date(review.createdAt).toLocaleDateString()}</small>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-danger" onclick="deleteReview('${review._id}')">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading reviews:', error);
                document.getElementById('reviewsList').innerHTML = '<p class="text-center text-danger">Failed to load reviews.</p>';
            }
        }

        // Create new book
        async function createBook() {
            const title = document.getElementById('bookTitle').value;
            const author = document.getElementById('bookAuthor').value;
            const description = document.getElementById('bookDescription').value;
            const publishedDate = document.getElementById('bookDate').value;
            
            if (!title || !author || !description || !publishedDate) {
                showAlert('Error', 'Please fill in all fields');
                return;
            }
            
            try {
                const response = await fetch('/books', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title,
                        author,
                        description,
                        publishedDate
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to create book');
                }
                
                // Close modal and refresh books
                bootstrap.Modal.getInstance(document.getElementById('createBookModal')).hide();
                document.getElementById('createBookForm').reset();
                loadMyBooks();
                showAlert('Success', 'Book created successfully!');
            } catch (error) {
                console.error('Error creating book:', error);
                showAlert('Error', error.message);
            }
        }

        // Edit book
        function editBook(id, title, author, description, publishedDate) {
            // Decode HTML entities
            const decodeHTML = (html) => {
                const txt = document.createElement('textarea');
                txt.innerHTML = html;
                return txt.value;
            };
            
            document.getElementById('updateBookId').value = id;
            document.getElementById('updateBookTitle').value = decodeHTML(title);
            document.getElementById('updateBookAuthor').value = decodeHTML(author);
            document.getElementById('updateBookDescription').value = decodeHTML(description);
            document.getElementById('updateBookDate').value = publishedDate.split('T')[0];
            
            const modal = new bootstrap.Modal(document.getElementById('updateBookModal'));
            modal.show();
        }

        // Update book
        async function updateBook() {
            const id = document.getElementById('updateBookId').value;
            const title = document.getElementById('updateBookTitle').value;
            const author = document.getElementById('updateBookAuthor').value;
            const description = document.getElementById('updateBookDescription').value;
            const publishedDate = document.getElementById('updateBookDate').value;
            
            if (!title || !author || !description || !publishedDate) {
                showAlert('Error', 'Please fill in all fields');
                return;
            }
            
            try {
                const response = await fetch(`/books/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title,
                        author,
                        description,
                        publishedDate
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to update book');
                }
                
                // Close modal and refresh books
                bootstrap.Modal.getInstance(document.getElementById('updateBookModal')).hide();
                loadMyBooks();
                showAlert('Success', 'Book updated successfully!');
            } catch (error) {
                console.error('Error updating book:', error);
                showAlert('Error', error.message);
            }
        }

        // Delete book
        let deleteBookId = null;
        function deleteBook(id) {
            console.log('Delete book called with ID:', id);
            deleteBookId = id;
            const modal = new bootstrap.Modal(document.getElementById('deleteBookModal'));
            modal.show();
        }

        // Delete review
        let deleteReviewId = null;
        function deleteReview(id) {
            console.log('Delete review called with ID:', id);
            deleteReviewId = id;
            const modal = new bootstrap.Modal(document.getElementById('deleteReviewModal'));
            modal.show();
        }

        // Set up modal confirm handlers - only once
        let handlersInitialized = false;
        
        function initializeDeleteHandlers() {
            if (handlersInitialized) return;
            handlersInitialized = true;
            
            const confirmDeleteBookBtn = document.getElementById('confirmDeleteBook');
            const confirmDeleteReviewBtn = document.getElementById('confirmDeleteReview');
            
            if (confirmDeleteBookBtn) {
                confirmDeleteBookBtn.addEventListener('click', async function() {
                    console.log('Deleting book with ID:', deleteBookId);
                    const modal = bootstrap.Modal.getInstance(document.getElementById('deleteBookModal'));
                    modal.hide();
                    
                    try {
                        const response = await fetch(`/books/${deleteBookId}`, {
                            method: 'DELETE'
                        });
                        
                        if (!response.ok) throw new Error('Failed to delete book');
                        
                        loadMyBooks();
                        showAlert('Success', 'Book deleted successfully!');
                    } catch (error) {
                        console.error('Error deleting book:', error);
                        showAlert('Error', 'Failed to delete book');
                    }
                });
            }

            if (confirmDeleteReviewBtn) {
                confirmDeleteReviewBtn.addEventListener('click', async function() {
                    console.log('Deleting review with ID:', deleteReviewId);
                    const modal = bootstrap.Modal.getInstance(document.getElementById('deleteReviewModal'));
                    modal.hide();
                    
                    try {
                        const response = await fetch(`/reviews/${deleteReviewId}`, {
                            method: 'DELETE'
                        });
                        
                        if (!response.ok) throw new Error('Failed to delete review');
                        
                        loadMyReviews();
                        showAlert('Success', 'Review deleted successfully!');
                    } catch (error) {
                        console.error('Error deleting review:', error);
                        showAlert('Error', 'Failed to delete review');
                    }
                });
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            initializeDeleteHandlers();
        });
        
        loadNavbar();
        loadProfile();
        loadMyBooks();
        loadMyReviews();
    </script>

    <!-- Delete Book Confirmation Modal -->
    <div class="modal fade" id="deleteBookModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this book?</p>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBook">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Review Confirmation Modal -->
    <div class="modal fade" id="deleteReviewModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this review?</p>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteReview">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Success/Error Alert Modal -->
    <div class="modal fade" id="alertModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="alertModalTitle">Notification</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="alertModalMessage"></p>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/checkAuth.js"></script>

</body>
</html>
