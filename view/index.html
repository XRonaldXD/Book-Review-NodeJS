<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Placeholder :D</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .book-card {
            transition: transform .2s, box-shadow .2s;
            height: 100%;
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15) !important;
        }

        .book-cover {
            height: 300px;
            object-fit: cover;
        }

        .search-box {
            max-width: 600px;
        }

    </style>
</head>

<body>

    <div id="navbar"></div>
    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-primary">Book List</h1>
            <p class="lead text-muted">Discover your next favorite read</p>
        </div>

        <div class="d-flex justify-content-center mb-5">
            <form class="d-flex search-box" role="search" style="max-width: 600px; width: 100%;">
                <input class="form-control me-2" id="searchInput" type="search" placeholder="Search by title"
                    aria-label="Search" autocomplete="off">
                <button class="btn btn-outline-primary" type="button">Search</button>
            </form>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4" id="booksGrid">

        </div>

        <div class="text-center mt-5 d-none" id="noResults">
            <i class="fas fa-book-open fa-4x text-muted mb-3"></i>
            <h3 class="text-muted">No books found</h3>
            <p class="text-muted">Try a different search term</p>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar').innerHTML = data;
            });
    </script>

    <script>
        async function fetchBooks() {
            try {
                const response = await fetch('/api/books/get'); // Updated endpoint to match backend route
                if (!response.ok) {
                    throw new Error('Failed to fetch books');
                }
                const books = await response.json();
                renderBooks(books);
            } catch (error) {
                console.error('Error fetching books:', error);
                document.getElementById('booksGrid').innerHTML = '<p class="text-danger">Failed to load books. Please try again later.</p>';
            }
        }

        const grid = document.getElementById('booksGrid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');

        function renderBooks(bookArray) {
            if (bookArray.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('d-none');
                return;
            }
            noResults.classList.add('d-none');
            grid.innerHTML = bookArray.map(book => `
                <div class="col">
                    <div class="card book-card h-100 shadow-sm border-0">
                        <img src="${book.cover}" class="card-img-top book-cover" alt="${book.title}">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title mb-1">${book.title}</h5>
                            <p class="card-text text-muted small mb-2">${book.author}</p>
                            <span class="badge bg-primary mb-3">${book.genre}</span>
                            <div class="mt-auto">
                                <button class="btn btn-outline-primary btn-sm w-100">
                                    <i class="fas fa-eye"></i> View Details
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        searchInput.addEventListener('input', async () => {
            const term = searchInput.value.toLowerCase();
            try {
                const response = await fetch(`/api/books/get?search=${term}`); // Updated endpoint for search functionality
                if (!response.ok) {
                    throw new Error('Failed to fetch search results');
                }
                const filteredBooks = await response.json();
                renderBooks(filteredBooks);
            } catch (error) {
                console.error('Error during search:', error);
                grid.innerHTML = '<p class="text-danger">Failed to load search results. Please try again later.</p>';
            }
        });

        // Initial render
        fetchBooks();
    </script>

</body>

</html>
