<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Placeholder :D</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .book-details {
            background: #1f1f1f;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid #2d2d2d;
            padding: 20px;
            color: #ffffff;
        }

        .book-details h2 {
            color: #ffffff;
            font-weight: 600;
        }

        .book-details p {
            color: #b0b0b0;
        }

        .container {
            background: #1f1f1f;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .text-center i {
            color: #667eea;
        }

        .col-md-8 {
            color: #ffffff;
        }

        .col-md-8 h3 {
            color: #ffffff;
        }

        .col-md-8 p {
            color: #b0b0b0;
        }

        .text-muted {
            color: #b0b0b0 !important; /* Match book details text color */
        }

        .modal-content {
            background: #1f1f1f;
            border: 1px solid #2d2d2d;
        }

        .modal-header {
            border-bottom: 1px solid #2d2d2d;
        }

        .modal-footer {
            border-top: 1px solid #2d2d2d;
        }

        h4 {
            color: #ffffff;
        }

        .form-label {
            color: #b0b0b0;
            font-weight: 600;
        }

        .form-control, .form-select {
            background: #2a2a2a;
            border: 2px solid #3d3d3d;
            color: #ffffff;
            border-radius: 10px;
        }

        .form-control:focus, .form-select:focus {
            background: #333333;
            border-color: #667eea;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
        }

        .form-control::placeholder {
            color: #808080;
        }

        .btn-close {
            filter: invert(1);
        }

        .btn-primary {
            background: #667eea;
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .ms-2 {
            color: #b0b0b0;
        }

        .btn-secondary {
            background: #3d3d3d;
            border: none;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background: #4d4d4d;
            color: #ffffff;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Navbar Container -->
    <div id="navbar"></div>

    <div class="container my-5">
        <h1 class="mb-4">Book Details</h1>

        <!-- Book details content goes here -->
        <div class="row">
            <!-- Left Column: Book Icon and Details -->
            <div class="col-md-4">
                <div class="text-center mb-4">
                    <i class="bi bi-book" style="font-size: 6rem; color: #667eea;"></i>
                </div>
                <div class="book-details">
                    <h2 id="bookTitle">Book Title</h2>
                    <p><strong>Author:</strong> <span id="bookAuthor">Author Name</span></p>
                    <p><strong>Published Year:</strong> <span id="bookYear">2025</span></p>
                    <p><strong>Description:</strong></p>
                    <p id="bookDescription">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Proin vel nisi nec
                        justo vehicula tincidunt.</p>
                </div>
            </div>

            <!-- Middle and Right Column -->
            <div class="col-md-8">
                <h3>Reviews</h3>
                <button class="btn btn-primary mb-3" 
                        data-bs-toggle="modal" 
                        data-bs-target="#createReviewModal"
                        id="addReviewButton">
                    <i class="bi bi-plus-circle me-2"></i>
                    Add Your Review
                </button>
                <div id="reviewsList"></div>
            </div>
        </div>
    </div>

    <!-- Create Review Modal -->
     <div class="modal fade" id="createReviewModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Add Your Review</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reviewForm">
                        <div class="mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text" class="form-control" id="reviewerName" required placeholder="Enter your name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Rating</label>
                            <div class="star-rating">
                                <i class="bi bi-star-fill star" data-value="1"></i>
                                <i class="bi bi-star-fill star" data-value="2"></i>
                                <i class="bi bi-star-fill star" data-value="3"></i>
                                <i class="bi bi-star-fill star" data-value="4"></i>
                                <i class="bi bi-star-fill star" data-value="5"></i>
                                <span class="ms-2" id="ratingText">0/5</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Comment</label>
                            <textarea class="form-control" id="reviewComment" rows="4" required placeholder="Write your review..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createReview()">Create Review</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    // Fetch book details dynamically
    async function fetchBookDetails() {
        try {
            const params = new URLSearchParams(window.location.search);
            const bookId = params.get('id');

            if (!bookId) {
                throw new Error('No book ID provided in the URL');
            }

            const response = await fetch(`/books/${bookId}`);
            if (!response.ok) throw new Error('Failed to fetch book details');
            const book = await response.json();

            document.getElementById('bookTitle').textContent = book.title;
            document.getElementById('bookAuthor').textContent = book.author;
            document.getElementById('bookYear').textContent = new Date(book.publishedDate).getFullYear();
            document.getElementById('bookDescription').textContent = book.description;

            // Load reviews for the book
            loadReviews(bookId);
        } catch (error) {
            console.error('Error fetching book details:', error);
            document.querySelector('.container').innerHTML = `
                <p class="text-center text-danger">Failed to load book details. Please try again later.</p>
            `;
        }
    }

    // Fetch reviews dynamically
    async function loadReviews(bookId) {
        try {
            const response = await fetch('/reviews');
            if (!response.ok) throw new Error('Failed to fetch reviews');
            const allReviews = await response.json();

            // Filter reviews by bookId
            const reviews = allReviews.filter(review => review.bookId === bookId);

            const reviewsList = document.getElementById('reviewsList');
            reviewsList.innerHTML = reviews.length
                ? reviews.map(review => `
                    <div class="mb-3">
                        <p><strong>${review.createdBy}</strong> <span class="text-muted">(${review.rating}/5)</span></p>
                        <p>${review.comment}</p>
                        <small class="text-muted">${new Date(review.createdAt).toLocaleString()}</small>
                    </div>
                `).join('')
                : '<p class="text-muted">No reviews yet. Be the first to leave a review!</p>';
        } catch (error) {
            console.error('Error loading reviews:', error);
            document.getElementById('reviewsList').innerHTML = `
                <p class="text-center text-danger">Failed to load reviews. Please try again later.</p>
            `;
        }
    }

    // Star rating functionality
    document.addEventListener('DOMContentLoaded', function () {
        const stars = document.querySelectorAll('.star-rating .star');
        const ratingText = document.getElementById('ratingText');
        let selectedRating = 0;

        stars.forEach(star => {
            // Click to select rating
            star.addEventListener('click', function () {
                selectedRating = this.getAttribute('data-value');
                updateStars(selectedRating);
            });

            // Hover effect (optional but nice)
            star.addEventListener('mouseover', function () {
                const hoverValue = this.getAttribute('data-value');
                highlightStars(hoverValue);
            });
        });

        // When mouse leaves the rating area, show the actually selected rating
        document.querySelector('.star-rating').addEventListener('mouseleave', function () {
            updateStars(selectedRating);
        });

        function updateStars(value) {
            stars.forEach(star => {
                if (parseInt(star.getAttribute('data-value')) <= value) {
                    star.style.color = '#ffd700'; // Gold for selected/filled
                } else {
                    star.style.color = '#444';    // Dark for empty
                }
            });
            ratingText.textContent = `${value || 0}/5`;
        }

        function highlightStars(value) {
            stars.forEach(star => {
                if (parseInt(star.getAttribute('data-value')) <= value) {
                    star.style.color = '#ffd700';
                } else {
                    star.style.color = '#444';
                }
            });
        }

        // Make the selected rating available to createReview()
        window.getSelectedRating = function () {
            return selectedRating;
        };
    });

    // Create a new review
    async function createReview() {
        const params = new URLSearchParams(window.location.search);
        const bookId = params.get('id');

        const reviewerName = document.getElementById('reviewerName').value;
        const rating = window.getSelectedRating ? window.getSelectedRating() : 0;
        const reviewComment = document.getElementById('reviewComment').value;

        const response = await fetch('/auth/me');
        if (!response.ok) {
            window.location.href = '/login';
            return;
        }

        if (!reviewerName || !rating || !reviewComment) {
            alert('Please fill in all fields and select a rating.');
            return;
        }

        const reviewData = {
            bookId: bookId,
            createdBy: reviewerName,
            rating: parseInt(rating),
            comment: reviewComment,
            createdAt: new Date().toISOString()
        };

        try {
            const response = await fetch('/reviews', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(reviewData)
            });

            if (!response.ok) throw new Error('Failed to create review');

            // Close modal and refresh reviews
            const createReviewModal = bootstrap.Modal.getInstance(document.getElementById('createReviewModal'));
            createReviewModal.hide();
            fetchBookDetails();
        } catch (error) {
            console.error('Error creating review:', error);
            alert('Failed to submit review. Please try again later.');
        }
    }

    // Check if user is logged in and show/hide review button
    async function checkLoginAndToggleReviewButton() {
        try {
            const response = await fetch('/auth/me');
            const addReviewButton = document.getElementById('addReviewButton');
            
            if (response.ok) {
                const data = await response.json();
                if (data.loggedIn) {
                    addReviewButton.style.display = 'inline-block';
                } else {
                    addReviewButton.style.display = 'none';
                }
            } else {
                addReviewButton.style.display = 'none';
            }
        } catch (error) {
            console.error('Error checking login status:', error);
            document.getElementById('addReviewButton').style.display = 'none';
        }
    }

    // Load navbar with auth check
    async function loadNavbar() {
        try {
            const response = await fetch('navbar.html');
            if (!response.ok) throw new Error('Failed to load navbar');
            document.getElementById('navbar').innerHTML = await response.text();
            // Check authentication after navbar loads
            if (window.checkNavbarAuth) {
                window.checkNavbarAuth();
            }
        } catch (error) {
            console.error('Error loading navbar:', error);
        }
    }

    // Initial fetch
    loadNavbar();
    fetchBookDetails();
    checkLoginAndToggleReviewButton();

</script>

<script src="./js/checkAuth.js"></script>
</body>

</html>
