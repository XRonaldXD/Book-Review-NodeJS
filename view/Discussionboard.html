<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #170707;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px;
            text-align: center;
        }
        nav {
            background-color: #090202;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: rgb(241, 237, 237);
            box-shadow: 0 0 10px rgba(249, 247, 247, 0.1);
        }
        .thread {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }
        .thread h3 {
            margin: 0;
            color: #190b0b;
        }
        .thread-meta {
            font-size: 0.9em;
            color: #110d0d;
        }
        .thread-preview {
            margin-top: 10px;
            color: #555;
        }
        .new-thread-form {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
        .new-thread-form input, .new-thread-form textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        .new-thread-form button {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Discussion Area</h1>
    </header>

    <div id="navbar"></div>
    <script>
        async function loadNavbar() {
            try {
                const response = await fetch('navbar.html');
                if (!response.ok) throw new Error('Failed to load navbar');
                document.getElementById('navbar').innerHTML = await response.text();
            } catch (error) {
                console.error('Error loading navbar:', error);
            }
        }
        loadNavbar();
    </script>


    <div class="container">
        <section id="new" class="new-thread-form">
            <h2>Make a Comment</h2>
            <form id="newThreadForm" action="#" method="post">
                <input type="text" id="title" name="title" placeholder="Title" required>
                <textarea id="content" name="content" rows="5" placeholder="Your message..." required></textarea>
                <button type="submit">Post Comment</button>
            </form>
        </section>

        <section id="threads">
            <h2>Recent Comment</h2>
            <div class="thread">
                <h3>Getting Started with HTML</h3>
                <div class="thread-meta">Posted by: User1 on November 18, 2025</div>
                <div class="thread-preview">Hi everyone, I'm new to web development and would like some tips on HTML basics...</div>
            </div>
        </section>
    </div>
<script>
        document.getElementById('newThreadForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const username = 'Anonymous'; 
            const date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

            if (!title || !content) {
                alert('Please fill in both title and content.');
                return;
            }

            const newThread = document.createElement('div');
            newThread.className = 'thread';
            newThread.innerHTML = `
                <h3>${title}</h3>
                <div class="thread-meta">Posted by: ${username} on ${date}</div>
                <div class="thread-preview">${content.substring(0, 100)}${content.length > 100 ? '...' : ''}</div>
            `;

            const threadsSection = document.getElementById('threads');
            threadsSection.insertBefore(newThread, threadsSection.firstElementChild.nextSibling);

            document.getElementById('title').value = '';
            document.getElementById('content').value = '';
        });
    </script>
</body>

</html>
