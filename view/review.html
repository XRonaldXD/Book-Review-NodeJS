<--attached under book-details.html-->
    <div id="reviewsSection" class="container mt-5">
        <h3 class="mb-4">Reviews</h3>
        <div id="reviewsList" class="mb-4">
            <!-- Reviews will be dynamically loaded here -->
        </div>
        <form id="reviewForm" class="mb-3">
            <div class="mb-3">
                <label for="reviewText" class="form-label">Write a Review</label>
                <textarea id="reviewText" class="form-control" rows="3"
                    placeholder="Share your thoughts about this book"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit Review</button>
        </form>
    </div>
